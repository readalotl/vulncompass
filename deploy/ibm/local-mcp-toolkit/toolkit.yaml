# watsonx Orchestrate LOCAL MCP toolkit import config.
#
# DO NOT import this file directly. Use the register script:
#   bash deploy/ibm/local-mcp-toolkit/register-toolkit.sh
#
# The register script builds a minimal, self-contained staging directory with a
# FLATTENED layout — `vulncompass/` and `server.py` sit directly at
# package_root (no src/ prefix), plus a pinned requirements.txt — then rewrites
# `package_root` to point at it before calling `orchestrate toolkits import`.
# This keeps the upload tiny, avoids a 413 "Request Entity Too Large" from
# uploading the whole repo, and makes `vulncompass` importable at runtime.
#
# WHY uv run instead of python:
# fastmcp (and mcp) require Python >=3.10. The system Python on the
# Orchestrate tools-runtime host may be 3.9. `uv run --python 3.12` resolves
# and installs deps into an isolated environment using the uv-managed 3.12
# interpreter, bypassing the system Python and the separate requirements.txt
# install step entirely.
#
# This template's server needs NO credentials, so no `connections` are declared.
# If your server needs secrets, add a connection (see README) and list it here.
spec_version: v1
kind: mcp
name: vulncompass
description: "VulnCompass MCP server (local stdio transport for watsonx Orchestrate)."
command: uv run --python 3.12 --with fastmcp --with httpx --with pydantic --with pydantic-settings server.py
env: []
tools:
  - "*"
# Placeholder — the register script overwrites this with the staging dir path.
package_root: ./_stage
