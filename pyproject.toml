[project]
name = "vulncompass-mcp"
version = "0.1.0"
description = "Local-first federal vulnerability decision support MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
vulncompass-mcp = "vulncompass.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulncompass"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
eval = [
    "arize-phoenix>=12.0.0",
    "openinference-instrumentation-langchain>=0.1.55",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.3.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    # vulnerability floor constraints (transitive via arize-phoenix)
    "authlib>=1.9.1",
    "dnspython>=2.9.0",
    "joserfc>=1.7.6",
    "opentelemetry-api>=1.45.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents", "eval"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
