name: Eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_MODEL: openai:gpt-4o-mini
      JUDGE_MODEL: openai:gpt-4o-mini
      PHOENIX_HOST: http://localhost:6006

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group eval

      - name: Start Phoenix
        run: |
          # Run Phoenix directly so $! captures the actual server PID,
          # not uv's process wrapper.
          # PHOENIX_HOST=127.0.0.1 prevents the serve command from binding
          # to [::] (IPv6 wildcard), which triggers a urljoin crash in
          # Phoenix 21.x when constructing the display URL.
          PHOENIX_HOST=127.0.0.1 .venv/bin/python -m phoenix.server.main serve &
          echo $! > /tmp/phoenix.pid
          # Wait until the HTTP endpoint is ready (up to 60 s).
          for i in $(seq 1 60); do
            curl -sf http://localhost:6006/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          # Fail fast if Phoenix never came up.
          curl -sf http://localhost:6006/healthz > /dev/null \
            || { echo "ERROR: Phoenix did not start"; exit 1; }

      - name: Run unit tests
        run: uv run pytest --tb=short -q

      - name: Run eval
        run: |
          uv run --group eval python eval/phoenix/run_experiment.py vulncompass \
            --model "$EVAL_MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --phoenix-host "$PHOENIX_HOST" \
            --fail-below-scope 1.0 \
            --fail-below-correctness 0.90

      - name: Stop Phoenix
        if: always()
        run: kill $(cat /tmp/phoenix.pid) 2>/dev/null || true
