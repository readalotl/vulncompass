name: Eval (correctness)

# LLM-as-judge correctness is non-deterministic: a single run can flip
# between 87% and 100% on identical code due to model temperature variance.
# Running it as a hard gate on every push produces false failures.
#
# Instead this workflow runs:
#   - nightly at 02:00 UTC (catches regressions without blocking PRs)
#   - on demand via workflow_dispatch (run before a release or after prompt changes)
#
# It is intentionally NOT triggered on push or pull_request.
# Scope correctness (deterministic tool-call check) remains a hard gate in ci.yml.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fail_below:
        description: "Fail if correctness is below this rate (0.0–1.0)"
        default: "0.9"
        required: false

jobs:
  correctness:
    name: Correctness judge
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FAIL_BELOW: ${{ inputs.fail_below || '0.9' }}

    services:
      phoenix:
        image: arizephoenix/phoenix:latest
        ports:
          - 6006:6006
        env:
          PHOENIX_ENABLE_AUTH: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --group eval

      - name: Wait for Phoenix
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6006/healthz && break
            echo "Waiting for Phoenix… ($i/30)"
            sleep 2
          done

      - name: Run correctness eval
        run: |
          uv run --group eval python eval/phoenix/run_experiment.py vulncompass \
            --model openai:gpt-4o-mini \
            --judge-model openai:gpt-4o-mini \
            --fail-below-scope 1.0 \
            --fail-below-correctness "$FAIL_BELOW"
        env:
          PHOENIX_HOST: http://localhost:6006
