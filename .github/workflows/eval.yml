name: Eval (correctness)

# Two-tier evaluation:
#
# Hard gate  — deterministic tool-result checks (--fail-below-tool-checks).
#   Asserts structured fields from the MCP tool's JSON output: recommendation,
#   confidence, policy_rules, kev.listed, rank, source_conflicts, review_status,
#   action.  These never change unless the service logic changes.
#
# Informational — LLM-as-judge correctness score.
#   Checks whether the agent's prose faithfully represents the tool result.
#   Non-deterministic; shown in the summary but does NOT gate the workflow.
#   The score is preserved in the phoenix-failed-cases artifact for review.
#
# Runs nightly and on workflow_dispatch. Not triggered on push/pull_request.
# Scope (deterministic tool-call check) remains a hard gate in ci.yml.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fail_below_tool_checks:
        description: "Fail if deterministic tool-check pass rate is below this (0.0–1.0)"
        default: "1.0"
        required: false

jobs:
  correctness:
    name: Correctness judge
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FAIL_BELOW_TOOL_CHECKS: ${{ inputs.fail_below_tool_checks || '1.0' }}

    services:
      phoenix:
        image: arizephoenix/phoenix:latest
        ports:
          - 6006:6006
        env:
          PHOENIX_ENABLE_AUTH: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --group eval

      - name: Check saved evaluation cases
        run: |
          uv run --group eval python -m eval.phoenix.check_saved_cases \
            eval/phoenix/fixtures/saved-failures.json \
            | tee saved-case-results.txt

      - name: Upload saved-case results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: saved-case-results
          path: saved-case-results.txt
          if-no-files-found: warn

      - name: Wait for Phoenix
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6006/healthz && break
            echo "Waiting for Phoenix… ($i/30)"
            sleep 2
          done

      - name: Run correctness eval
        run: |
          uv run --group eval python eval/phoenix/run_experiment.py vulncompass \
            --model openai:gpt-4o-mini \
            --judge-model openai:gpt-4o-mini \
            --fail-below-scope 1.0 \
            --fail-below-tool-checks "$FAIL_BELOW_TOOL_CHECKS"
        env:
          PHOENIX_HOST: http://localhost:6006

      - name: Upload failed evaluation cases
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-failed-cases
          path: eval-failures.json
          if-no-files-found: warn
