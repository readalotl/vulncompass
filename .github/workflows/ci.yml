name: CI

# Minimal required permissions — no job may write to the repo, packages, or
# deployments without explicitly requesting it.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test suite
    runs-on: ubuntu-latest
    # Tests must not start before lint passes — a broken import crashes pytest
    # in a confusing way that wastes CI minutes.
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest tests/ -v

  # ── Eval – scope + correctness (requires OPENAI_API_KEY) ─────────────────
  # The scope judge verifies the agent called a VulnCompass tool (no LLM
  # needed for scoring), but the agent itself needs an LLM to reason and call
  # tools — Ollama is not available on GitHub Actions runners, so we use
  # gpt-4o-mini for the agent in CI. The correctness judge also uses it.
  eval-scope:
    name: Eval – scope judge
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    services:
      phoenix:
        image: arizephoenix/phoenix:latest
        ports:
          - 6006:6006
        env:
          PHOENIX_ENABLE_AUTH: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies (main + eval)
        run: uv sync --frozen --group eval

      - name: Wait for Phoenix to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6006/healthz && break
            echo "Waiting for Phoenix… ($i/30)"
            sleep 2
          done

      - name: Run scope-only eval (fail below 100%)
        run: |
          uv run --group eval python eval/phoenix/run_experiment.py vulncompass \
            --model openai:gpt-4o-mini \
            --skip-correctness-judge \
            --fail-below-scope 1.0
        env:
          PHOENIX_HOST: http://localhost:6006

  # ── Eval – correctness judge (requires OPENAI_API_KEY) ───────────────────
  eval-correctness:
    name: Eval – correctness judge
    runs-on: ubuntu-latest
    needs: test
    services:
      phoenix:
        image: arizephoenix/phoenix:latest
        ports:
          - 6006:6006
        env:
          PHOENIX_ENABLE_AUTH: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies (main + eval)
        run: uv sync --frozen --group eval

      - name: Wait for Phoenix to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6006/healthz && break
            echo "Waiting for Phoenix… ($i/30)"
            sleep 2
          done

      - name: Run correctness eval (fail below 80%)
        run: |
          uv run --group eval python eval/phoenix/run_experiment.py vulncompass \
            --judge-model openai:gpt-4o-mini \
            --fail-below-scope 1.0 \
            --fail-below-correctness 0.8
        env:
          PHOENIX_HOST: http://localhost:6006
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ── Deploy (manual only) ──────────────────────────────────────────────────
  # Deployment to IBM watsonx Orchestrate is intentionally manual until durable
  # storage (non-SQLite) and MCP transport authentication are settled.
  # When ready, uncomment this job and set the required secrets in repo settings:
  #   WXO_API_KEY, WXO_INSTANCE_URL, WXO_ENV_NAME
