  #       env:
  #         WXO_API_KEY: ${{ secrets.WXO_API_KEY }}
  #         WXO_INSTANCE_URL: ${{ secrets.WXO_INSTANCE_URL }}
  #         WXO_ENV_NAME: ${{ secrets.WXO_ENV_NAME }}
  #         TOOLKIT_NAME: vulncompass
  #       run: bash deploy/ibm/local-mcp-toolkit/register-toolkit.sh
