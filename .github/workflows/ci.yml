name: CI

# Minimal required permissions — no job may write to the repo, packages, or
# deployments without explicitly requesting it.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test suite
    runs-on: ubuntu-latest
    # Tests must not start before lint passes — a broken import crashes pytest
    # in a confusing way that wastes CI minutes.
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest tests/ -v

  # ── Deploy (manual only) ──────────────────────────────────────────────────
  # Deployment to IBM watsonx Orchestrate is intentionally manual until durable
  # storage (non-SQLite) and MCP transport authentication are settled.
  # When ready, uncomment this job and set the required secrets in repo settings:
  #   WXO_API_KEY, WXO_INSTANCE_URL, WXO_ENV_NAME
